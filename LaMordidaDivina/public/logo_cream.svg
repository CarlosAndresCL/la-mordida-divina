<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>La Mordida Divina</title>
  <circle cx="256" cy="256" r="256" fill="#FDF8F0"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="#8FD3DC" stroke-width="18"/>

  <!-- Rodillo: azul medio, más suave que la v4 pero con contraste -->
