name: CI

on:
    push:
    pull_request:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            HUSKY: 0
        defaults:
            run:
                working-directory: LaMordidaDivina
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: LaMordidaDivina/package-lock.json

            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run build