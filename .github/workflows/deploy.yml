name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            HUSKY: 0
        defaults:
            run:
                working-directory: LaMordidaDivina
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: LaMordidaDivina/package-lock.json

            - run: npm ci
            - run: npm run build -- --base=/${{ github.event.repository.name }}/
            - run: cp dist/index.html dist/404.html

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: LaMordidaDivina/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4